name: doctor

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_analyze:
        description: Force analyze outside configured analyze day
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

env:
  SOURCE_REPO: G-Core/agent-toolkit
  REPORT_TZ: UTC
  PYTHON_VERSION: '3.12'
  ANALYZE_DAY: monday

jobs:
  resolve_analyze:
    needs: collect
    runs-on: ${{ vars.DOCTOR_RUNS_ON || 'self-hosted-ubuntu-22-04-light-x64' }}
    outputs:
      provider: ${{ steps.resolve.outputs.provider }}
      skip_reason: ${{ steps.resolve.outputs.skip_reason }}
    steps:
      - name: Resolve analyze provider
        id: resolve
        shell: bash
        env:
          REQUESTED_PROVIDER: ${{ vars.DOCTOR_AI_PROVIDER || 'auto' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[vars.DOCTOR_CLAUDE_OAUTH_SECRET_NAME || 'CLAUDE_CODE_OAUTH_TOKEN'] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets[vars.DOCTOR_ANTHROPIC_SECRET_NAME || 'ANTHROPIC_API_KEY'] || secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets[vars.DOCTOR_OPENAI_SECRET_NAME || 'OPENAI_API_KEY'] || secrets.OPENAI_API_KEY }}
          FORCE_ANALYZE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_analyze == 'true' }}
          ANALYZE_DAY: ${{ needs.collect.outputs.analyze_day }}
          REPORT_TZ: ${{ needs.collect.outputs.report_tz }}
        run: |
          set -eu

          requested="${REQUESTED_PROVIDER:-auto}"
          provider="none"
          skip_reason=""

          case "$requested" in
            none)
              skip_reason="provider_disabled"
              ;;
            auto)
              if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; then
                provider="claude"
              elif [ -n "${OPENAI_API_KEY:-}" ]; then
                provider="codex"
              else
                skip_reason="no_ai_credentials"
              fi
              ;;
            claude)
              if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                skip_reason="claude_credentials_missing"
              else
                provider="claude"
              fi
              ;;
            codex)
              if [ -z "${OPENAI_API_KEY:-}" ]; then
                skip_reason="codex_credentials_missing"
              else
                provider="codex"
              fi
              ;;
            *)
              echo "::error::invalid DOCTOR_AI_PROVIDER '$requested'. Expected auto, claude, codex, or none."
              exit 1
              ;;
          esac

          if [ "$provider" != "none" ] && [ "${FORCE_ANALYZE:-false}" != "true" ]; then
            analyze_day=$(printf '%s' "${ANALYZE_DAY:-}" | tr '[:upper:]' '[:lower:]')
            today_name=$(TZ="${REPORT_TZ:-UTC}" date '+%A' | tr '[:upper:]' '[:lower:]')
            if [ -z "$analyze_day" ] || [ "$today_name" != "$analyze_day" ]; then
              provider="none"
              skip_reason="not_analyze_day"
            fi
          fi

          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"

  collect:
    runs-on: ${{ vars.DOCTOR_RUNS_ON || 'self-hosted-ubuntu-22-04-light-x64' }}
    outputs:
      should_act: ${{ steps.collect.outputs.should_act }}
      source_sha: ${{ steps.collect.outputs.source_sha }}
      installed_source_sha: ${{ steps.collect.outputs.installed_source_sha }}
      installed_runtime_sha: ${{ steps.collect.outputs.installed_runtime_sha }}
      act_reason: ${{ steps.collect.outputs.act_reason }}
      analyze_day: ${{ steps.collect.outputs.analyze_day }}
      report_tz: ${{ steps.collect.outputs.report_tz }}
      observed_findings_present: ${{ steps.collect.outputs.observed_findings_present }}
      source_ref: ${{ steps.source_ref.outputs.source_ref }}
      source_channel: ${{ steps.source_ref.outputs.source_channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve toolkit source ref
        id: source_ref
        shell: bash
        env:
          DOCTOR_STABLE_REF: ${{ vars.DOCTOR_STABLE_REF || 'doctor-v1' }}
          DOCTOR_CANARY_REF: ${{ vars.DOCTOR_CANARY_REF || '' }}
          DOCTOR_SOURCE_REF: ${{ vars.DOCTOR_SOURCE_REF || '' }}
        run: |
          set -eu

          stable_ref="${DOCTOR_STABLE_REF:-}"
          canary_ref="${DOCTOR_CANARY_REF:-}"
          override_ref="${DOCTOR_SOURCE_REF:-}"
          source_ref="$stable_ref"
          source_channel="stable"

          if [ -n "$canary_ref" ]; then
            source_ref="$canary_ref"
            source_channel="canary"
          fi
          if [ -n "$override_ref" ]; then
            source_ref="$override_ref"
            source_channel="override"
          fi

          validate_ref() {
            value="$1"
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "::error::invalid Doctor source ref '$value'"
                exit 1
                ;;
            esac
            if printf '%s\n' "$value" | grep -Eq \
              '^(doctor-v[1-9][0-9]*|doctor-canary-[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9a-f]{40})$'; then
              return
            fi
            echo "::error::invalid Doctor source ref '$value'"
            exit 1
          }

          validate_ref "$source_ref"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_channel=$source_channel" >> "$GITHUB_OUTPUT"
          echo "::notice::doctor source channel=$source_channel ref=$source_ref"

      - name: Checkout toolkit source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.source_ref.outputs.source_ref }}
          path: .doctor-source
          token: ${{ secrets[vars.DOCTOR_SOURCE_TOKEN_SECRET_NAME || 'ORG_GH_TOKEN_CI'] || secrets.ORG_GH_TOKEN_CI || secrets.TOOLKIT_READ_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Run collect
        id: collect
        env:
          DOCTOR_REPO_ROOT: ${{ github.workspace }}
          DOCTOR_OUTPUT_DIR: ${{ runner.temp }}/doctor
          DOCTOR_SOURCE_ROOT: ${{ github.workspace }}/.doctor-source
          DOCTOR_REPO_FULL_NAME: ${{ github.repository }}
          DOCTOR_REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCTOR_SOURCE_REPO: ${{ env.SOURCE_REPO }}
          DOCTOR_SOURCE_REF: ${{ steps.source_ref.outputs.source_ref }}
          DOCTOR_SOURCE_CHANNEL: ${{ steps.source_ref.outputs.source_channel }}
          DOCTOR_ANALYZE_DAY: ${{ env.ANALYZE_DAY }}
          DOCTOR_REPORT_TZ: ${{ env.REPORT_TZ }}
        run: python .doctor-source/workflows/runtime/collect.py

      - name: Upload doctor-findings artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doctor-findings
          path: ${{ runner.temp }}/doctor/doctor-findings.json
          if-no-files-found: error

  act:
    needs: collect
    if: ${{ needs.collect.outputs.should_act == 'true' }}
    runs-on: ${{ vars.DOCTOR_RUNS_ON || 'self-hosted-ubuntu-22-04-light-x64' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Persist the target credential for the existing GitClient fetch and push path.
          persist-credentials: true

      - name: Download doctor-findings artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: doctor-findings
          path: ${{ runner.temp }}/doctor-findings

      - name: Checkout toolkit source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.collect.outputs.source_ref }}
          path: .doctor-source
          token: ${{ secrets[vars.DOCTOR_SOURCE_TOKEN_SECRET_NAME || 'ORG_GH_TOKEN_CI'] || secrets.ORG_GH_TOKEN_CI || secrets.TOOLKIT_READ_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run act
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCTOR_REPO_ROOT: ${{ github.workspace }}
          DOCTOR_SOURCE_ROOT: ${{ github.workspace }}/.doctor-source
          DOCTOR_FINDINGS_PATH: ${{ runner.temp }}/doctor-findings/doctor-findings.json
          DOCTOR_SOURCE_SHA: ${{ needs.collect.outputs.source_sha }}
          DOCTOR_INSTALLED_SOURCE_SHA: ${{ needs.collect.outputs.installed_source_sha }}
          DOCTOR_INSTALLED_RUNTIME_SHA: ${{ needs.collect.outputs.installed_runtime_sha }}
          DOCTOR_ACT_REASON: ${{ needs.collect.outputs.act_reason }}
          DOCTOR_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCTOR_SOURCE_REPO: ${{ env.SOURCE_REPO }}
          DOCTOR_SOURCE_REF: ${{ needs.collect.outputs.source_ref }}
          DOCTOR_SOURCE_CHANNEL: ${{ needs.collect.outputs.source_channel }}
          DOCTOR_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .doctor-source/workflows/act.py

  analyze_claude:
    needs:
      - resolve_analyze
      - collect
      - act
    if: >-
      ${{
        always() &&
        needs.resolve_analyze.result == 'success' &&
        needs.resolve_analyze.outputs.provider == 'claude' &&
        needs.collect.result == 'success' &&
        (needs.act.result == 'success' || needs.act.result == 'skipped')
      }}
    # Required for reusable gh-aw analyze with safe outputs. GitHub validates
    # the caller permission envelope before analyze starts.
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: G-Core/agent-toolkit/.github/workflows/doctor-analyze.lock.yml@doctor-v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[vars.DOCTOR_CLAUDE_OAUTH_SECRET_NAME || 'CLAUDE_CODE_OAUTH_TOKEN'] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets[vars.DOCTOR_ANTHROPIC_SECRET_NAME || 'ANTHROPIC_API_KEY'] || secrets.ANTHROPIC_API_KEY }}
      GH_AW_GITHUB_TOKEN: ${{ secrets[vars.DOCTOR_GITHUB_TOKEN_SECRET_NAME || 'GH_AW_GITHUB_TOKEN'] || secrets.GH_AW_GITHUB_TOKEN }}
      GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets[vars.DOCTOR_GITHUB_MCP_TOKEN_SECRET_NAME || 'GH_AW_GITHUB_MCP_SERVER_TOKEN'] || secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
    with:
      force_analyze: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_analyze == 'true' }}
      analyze_day: ${{ needs.collect.outputs.analyze_day }}
      report_tz: ${{ needs.collect.outputs.report_tz }}
      issues_enabled: ${{ github.event.repository.has_issues && 'true' || 'false' }}
      observed_findings_present: ${{ needs.collect.outputs.observed_findings_present }}
      findings_artifact_name: doctor-findings
      source_sha: ${{ needs.collect.outputs.source_sha }}
      installed_source_sha: ${{ needs.collect.outputs.installed_source_sha }}
      installed_runtime_sha: ${{ needs.collect.outputs.installed_runtime_sha }}

  analyze_codex:
    needs:
      - resolve_analyze
      - collect
      - act
    if: >-
      ${{
        always() &&
        needs.resolve_analyze.result == 'success' &&
        needs.resolve_analyze.outputs.provider == 'codex' &&
        needs.collect.result == 'success' &&
        (needs.act.result == 'success' || needs.act.result == 'skipped')
      }}
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: G-Core/agent-toolkit/.github/workflows/doctor-analyze-codex.lock.yml@doctor-v1
    secrets:
      CODEX_API_KEY: ${{ secrets[vars.DOCTOR_OPENAI_SECRET_NAME || 'OPENAI_API_KEY'] || secrets.OPENAI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets[vars.DOCTOR_OPENAI_SECRET_NAME || 'OPENAI_API_KEY'] || secrets.OPENAI_API_KEY }}
      GH_AW_GITHUB_TOKEN: ${{ secrets[vars.DOCTOR_GITHUB_TOKEN_SECRET_NAME || 'GH_AW_GITHUB_TOKEN'] || secrets.GH_AW_GITHUB_TOKEN }}
      GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets[vars.DOCTOR_GITHUB_MCP_TOKEN_SECRET_NAME || 'GH_AW_GITHUB_MCP_SERVER_TOKEN'] || secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
    with:
      force_analyze: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_analyze == 'true' }}
      analyze_day: ${{ needs.collect.outputs.analyze_day }}
      report_tz: ${{ needs.collect.outputs.report_tz }}
      issues_enabled: ${{ github.event.repository.has_issues && 'true' || 'false' }}
      observed_findings_present: ${{ needs.collect.outputs.observed_findings_present }}
      findings_artifact_name: doctor-findings
      source_sha: ${{ needs.collect.outputs.source_sha }}
      installed_source_sha: ${{ needs.collect.outputs.installed_source_sha }}
      installed_runtime_sha: ${{ needs.collect.outputs.installed_runtime_sha }}

  analyze:
    needs:
      - resolve_analyze
      - collect
      - act
      - analyze_claude
      - analyze_codex
    if: >-
      ${{
        always() &&
        needs.collect.result == 'success' &&
        (needs.act.result == 'success' || needs.act.result == 'skipped') &&
        (needs.resolve_analyze.result == 'success' || needs.resolve_analyze.result == 'failure')
      }}
    runs-on: ${{ vars.DOCTOR_RUNS_ON || 'self-hosted-ubuntu-22-04-light-x64' }}
    steps:
      - name: Finalize analyze result
        shell: bash
        env:
          RESOLVE_ANALYZE_RESULT: ${{ needs.resolve_analyze.result }}
          ANALYZE_PROVIDER: ${{ needs.resolve_analyze.outputs.provider }}
          ANALYZE_SKIP_REASON: ${{ needs.resolve_analyze.outputs.skip_reason }}
          ANALYZE_CLAUDE_RESULT: ${{ needs.analyze_claude.result }}
          ANALYZE_CODEX_RESULT: ${{ needs.analyze_codex.result }}
        run: |
          set -eu

          if [ "$RESOLVE_ANALYZE_RESULT" != "success" ]; then
            echo "Analyze provider resolution failed"
            exit 1
          fi

          case "$ANALYZE_PROVIDER" in
            none)
              if [ -n "$ANALYZE_SKIP_REASON" ]; then
                echo "::notice::doctor analyze skipped: $ANALYZE_SKIP_REASON"
              else
                echo "::notice::doctor analyze skipped"
              fi
              ;;
            claude)
              if [ "$ANALYZE_CLAUDE_RESULT" != "success" ]; then
                echo "Claude analyze job finished with result: $ANALYZE_CLAUDE_RESULT"
                exit 1
              fi
              ;;
            codex)
              if [ "$ANALYZE_CODEX_RESULT" != "success" ]; then
                echo "Codex analyze job finished with result: $ANALYZE_CODEX_RESULT"
                exit 1
              fi
              ;;
            *)
              echo "Unknown analyze provider: $ANALYZE_PROVIDER"
              exit 1
              ;;
          esac
